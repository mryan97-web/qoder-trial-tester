<!DOCTYPE html>
<html>
<head><title>WASM Test</title></head>
<body>
<script>
// Test: can we load the WASM in a browser?
const objs = [null];
let nextSlot = 1;
function pushObj(v) { if (v === undefined) return 0; const s = nextSlot; objs[s] = v; nextSlot++; return s; }
function getObj(s) { return objs[s]; }
function dropObj(s) { objs[s] = null; }

let wasmExports = null;
let wasmMemory = null;
const encoder = new TextEncoder();
const decoder = new TextDecoder("utf-8", {ignoreBOM: true, fatal: true});

function decodeStr(ptr, len) {
  return decoder.decode(new Uint8Array(wasmMemory.buffer, ptr>>>0, len>>>0));
}

const imports = {
  "./qoder_auth_wasm_bg.js": {
    __wbg_Error_2e59b1b37a9a34c3: function(ptr, len) { return pushObj(Error(decodeStr(ptr, len))); },
    __wbg___wbindgen_is_function_49868bde5eb1e745: function(s) { return typeof getObj(s) === "function" ? 1 : 0; },
    __wbg___wbindgen_is_object_40c5a80572e8f9d3: function(s) { const v = getObj(s); return typeof v === "object" && v !== null ? 1 : 0; },
    __wbg___wbindgen_is_string_b29b5c5a8065ba1a: function(s) { return typeof getObj(s) === "string" ? 1 : 0; },
    __wbg___wbindgen_is_undefined_c0cca72b82b86f4d: function(s) { return getObj(s) === undefined ? 1 : 0; },
    __wbg___wbindgen_throw_81fc77679af83bc6: function(ptr, len) { throw new Error(decodeStr(ptr, len)); },
    __wbg_call_d578befcc3145dee: function() {
      const args = Array.from(arguments);
      try { return pushObj(getObj(args[0]).call(getObj(args[1]), getObj(args[2]))); }
      catch(e) { return pushObj(e); }
    },
    __wbg_crypto_38df2bab126b63dc: function(s) { return pushObj(getObj(s).crypto); },
    __wbg_getRandomValues_c44a50d8cfdaebeb: function() {
      const args = Array.from(arguments);
      try { getObj(args[0]).getRandomValues(getObj(args[1])); }
      catch(e) { return pushObj(e); }
    },
    __wbg_getRandomValues_d49329ff89a07af1: function(ptr, len) {
      try { const arr = new Uint8Array(wasmMemory.buffer, ptr>>>0, len>>>0); crypto.getRandomValues(arr); }
      catch(e) { return pushObj(e); }
    },
    __wbg_length_0c32cb8543c8e4c8: function(s) { return getObj(s).length; },
    __wbg_msCrypto_bd5a034af96bcba6: function(s) { return pushObj(getObj(s).msCrypto); },
    __wbg_new_99cabae501c0a8a0: function() { return pushObj(new Map()); },
    __wbg_new_with_length_9cedd08484b73942: function(len) { return pushObj(new Uint8Array(len >>> 0)); },
    __wbg_node_84ea875411254db1: function(s) { return 0; },
    __wbg_now_88621c9c9a4f3ffc: function() { return Date.now(); },
    __wbg_process_44c7a14e11e9f69e: function(s) { return 0; },
    __wbg_prototypesetcall_3e05eb9545565046: function(ptr, len, val) {
      Uint8Array.prototype.set.call(new Uint8Array(wasmMemory.buffer, ptr>>>0, len>>>0), getObj(val));
    },
    __wbg_randomFillSync_6c25eac9869eb53e: function() { return 0; },
    __wbg_require_b4edbdcf3e2a1ef0: function() { return 0; },
    __wbg_set_08463b1df38a7e29: function(m, k, v) { return pushObj(getObj(m).set(getObj(k), getObj(v))); },
    __wbg_static_accessor_GLOBAL_THIS_a1248013d790bf5f: function() { return pushObj(globalThis); },
    __wbg_static_accessor_GLOBAL_f2e0f995a21329ff: function() { return 0; },
    __wbg_static_accessor_SELF_24f78b6d23f286ea: function() { return 0; },
    __wbg_static_accessor_WINDOW_59fd959c540fe405: function() { return pushObj(window); },
    __wbg_subarray_0f98d3fb634508ad: function(s, start, end) { return pushObj(getObj(s).subarray(start>>>0, end>>>0)); },
    __wbg_versions_276b2795b1c6a219: function(s) { return 0; },
    __wbindgen_cast_0000000000000001: function(ptr, len) { return pushObj(new Uint8Array(wasmMemory.buffer, ptr>>>0, len>>>0)); },
    __wbindgen_cast_0000000000000002: function(ptr, len) { return pushObj(decodeStr(ptr, len)); },
    __wbindgen_object_clone_ref: function(s) { return pushObj(getObj(s)); },
    __wbindgen_object_drop_ref: function(s) { dropObj(s); },
  }
};

fetch("/qoder_auth.wasm")
  .then(r => r.arrayBuffer())
  .then(buf => WebAssembly.instantiate(buf, imports))
  .then(({instance}) => {
    wasmExports = instance.exports;
    wasmMemory = wasmExports.memory;
    console.log("WASM LOADED!");
    console.log("Exports:", Object.keys(wasmExports).join(", "));
    document.body.innerHTML = "<h1>WASM LOADED!</h1><pre>" + Object.keys(wasmExports).join("\n") + "</pre>";
  })
  .catch(e => {
    console.error("WASM error:", e);
    document.body.innerHTML = "<h1>WASM ERROR</h1><pre>" + e.message + "</pre>";
  });
</script>
</body>
</html>
