<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>inject · qoder</title>
<style>
*,::before,::after{box-sizing:border-box}
:root{--bg:#F2F2F7;--card:#FFF;--bar:#F7F7F9;--fill:#F5F5F7;--ink:#1D1D1F;--muted:#86868B;--faint:#8E8E93;--line:#00000014;--accent:#0071E3;--ok:#30D158;--ok-ink:#248A3D;--ok-soft:#30D1581F;--bad:#FF453A;--bad-ink:#D70015;--bad-soft:#FF453A26;--warn:#FF9F0A;--warn-soft:#FF9F0A26;--r:12px;--ease:cubic-bezier(.22,1,.36,1);--sh:0 4px 8px #0000000F,0 14px 36px #00000014}
:root[data-theme="dark"]{--bg:#1C1C1E;--card:#2C2C2E;--bar:#232326;--fill:#3A3A3C;--ink:#FFF;--muted:#98989F;--faint:#6E6E73;--line:#FFFFFF1F;--accent:#0A84FF;--ok:#32D74B;--ok-ink:#32D74B;--ok-soft:#32D74B26;--bad:#FF453A;--bad-ink:#FF453A;--bad-soft:#FF453A26;--sh:0 4px 8px #00000033,0 14px 36px #0000004D}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 60%);color:var(--ink);font-family:system-ui,sans-serif;font-size:13px;line-height:1.45}
.win{width:100%;max-width:480px;background:var(--card);border-radius:12px;box-shadow:var(--sh);outline:1px solid var(--line);overflow:hidden}
.wbar{display:flex;align-items:center;gap:5px;height:33px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.tl{width:10px;height:10px;border-radius:50%;flex:none}.tl:nth-child(1){background:#FF5F57}.tl:nth-child(2){background:#FEBC2E}.tl:nth-child(3){background:#28C840}
.wtitle{flex:1;text-align:center;font:600 11px system-ui;color:var(--ink)}
.wbody{padding:16px 16px 18px}
.trow{display:flex;align-items:baseline;gap:1px}
.t1{font-size:22px;font-weight:600;letter-spacing:-.5px}.t2{font-size:22px;font-weight:700;color:var(--accent)}
.sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.flab{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.ff{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--fill);border-radius:7px;outline:1px solid var(--line)}
.ff:focus-within{outline:2px solid var(--accent)}
.ff input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:500 12.5px monospace}
.ff input::placeholder{color:var(--faint)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:38px;margin-top:12px;border:0;border-radius:9px;background:linear-gradient(110deg,#0071E3,#0A84FF);color:#fff;font:600 13.5px system-ui;cursor:pointer;box-shadow:0 4px 12px #0071E34D;transition:filter .2s}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.btn .spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;display:none;animation:spin .7s linear infinite}
.btn.loading .txt{visibility:hidden}.btn.loading .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{display:none;margin-top:12px;padding:9px 11px;border-radius:8px;background:var(--bad-soft);color:var(--bad-ink);font-size:12px}
.result{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:13px}
.result.show{display:block;animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.rhead{display:flex;align-items:center;gap:8px}
.rlab{font-size:9px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.rspacer{flex:1;height:1px;background:var(--line)}
.respill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok-ink);font:600 9.5px system-ui}
.respill .pdot{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.respill.bad{background:var(--bad-soft);color:var(--bad-ink)}.respill.bad .pdot{background:var(--bad)}
.verdict{display:flex;align-items:center;gap:9px;margin-top:10px;padding:10px 12px;background:var(--fill);border-radius:9px;outline:1px solid var(--line)}
.vbar{width:3.5px;align-self:stretch;border-radius:999px;background:var(--ok)}
.verdict.fail .vbar{background:var(--bad)}
.vbig{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--ok-ink)}
.verdict.fail .vbig{color:var(--bad-ink)}
.vsub{font-size:7.5px;font-weight:600;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.vspace{flex:1}
.dur{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:var(--card);outline:1px solid var(--line);font:600 10px system-ui}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid #0000000A;font-size:11.5px}
.row .k{color:var(--muted);white-space:nowrap}.row .v{color:var(--ink);font-weight:600;text-align:right;word-break:break-word}
.log-box{margin-top:12px;background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;font-family:'Courier New',monospace;font-size:11px;line-height:1.6;display:none}
.log-box.show{display:block}
.log-box .log-line{color:#c9d1d9;white-space:pre-wrap;word-break:break-all}
.log-box .log-line.inject{color:#58a6ff}.log-box .log-line.success{color:#3fb950}.log-box .log-line.error{color:#f85149}.log-box .log-line.warning{color:#d29922}
.log-header{color:#8b949e;font-size:10px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #21262d}
.histblock{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.histhead{display:flex;align-items:center;gap:10px}
.sechead{font-size:9px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.counter{margin-left:auto;color:var(--muted);font-size:11.5px}
.hist{list-style:none;margin:10px 0 0;padding:0}
.hist li{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #0000000A;font-size:12px}
.hist li:last-child{border:0}
.histempty{justify-content:center;padding:12px 0!important;color:var(--muted)}
.dot2{width:7px;height:7px;border-radius:50%;flex:none}
.hp{font-family:monospace;font-size:11.5px;color:var(--ink)}
.htime{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.hist-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:2px 6px;border-radius:4px}
.hist-label.ok{color:#16a34a;background:rgba(34,197,94,.1)}.hist-label.fail{color:#dc2626;background:rgba(239,68,68,.1)}
.hidden{display:none!important}
#st{display:none;align-items:center;gap:8px;font-size:12px;padding:10px 14px;border-radius:8px;margin-top:12px}
#st.show{display:flex}
#st.st-processing{background:var(--warn-soft);border:1px solid rgba(234,179,8,.3);color:#ca8a04}
#st.st-success{background:var(--ok-soft);border:1px solid rgba(34,197,94,.3);color:var(--ok-ink)}
#st.st-fail{background:var(--bad-soft);border:1px solid rgba(239,68,68,.3);color:var(--bad-ink)}
#st.st-idle{background:transparent;border:1px solid var(--line);color:var(--muted)}
.idot{width:8px;height:8px;border-radius:50%;flex:none}
#st.st-processing .idot{background:#eab308;animation:pulse 1s infinite}
#st.st-success .idot{background:var(--ok)}
#st.st-fail .idot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
</style></head><body>
<div class="win">
<div class="wbar"><span class="tl"></span><span class="tl"></span><span class="tl"></span>
<div class="wtitle">Trial Injector</div></div>
<div class="wbody">
<div class="trow"><span class="t1">Inject trial</span><span class="t2">.</span></div>
<p class="sub">Paste Qoder PAT → server-side WASM injection → trial activated</p>
<form id="f" autocomplete="off">
<div class="field"><label class="flab" for="pat">PAT</label>
<div class="ff"><input id="pat" type="text" autocomplete="off" spellcheck="false" placeholder="pt-..." required></div></div>
<button id="btn" type="submit" class="btn"><span class="spin"></span><span class="txt">Inject trial</span></button>
</form>
<div id="st"></div>
<div id="log-box" class="log-box"><div class="log-header">📋 LIVE LOGS</div><div id="log-content"></div></div>
<div id="err" class="err"></div>
<div id="out" class="result">
<div class="rhead"><span class="rlab">Result</span><div class="rspacer"></div>
<span class="respill" id="respill"><span class="pdot" id="rdot"></span><span id="rtext">SUCCESS</span></span></div>
<div class="verdict" id="hero"><div class="vbar"></div>
<div><div class="vbig" id="verdict">-</div><div class="vsub" id="herolabel"></div></div>
<div class="vspace"></div>
<span class="dur" id="durms">-</span></div>
<div class="stats" id="result-stats"></div>
</div>
<div class="histblock"><div class="histhead">
<span class="sechead">History</span>
<span class="counter" id="injected-total">0 injected</span></div>
<ul id="hist" class="hist"><li class="histempty">No attempts yet.</li></ul></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const val=x=>x==null||x===''?'-':esc(x);
const f=$('f'),btn=$('btn'),err=$('err'),out=$('out'),patIn=$('pat'),st=$('st'),logBox=$('log-box'),logContent=$('log-content');
let logPolling=null,polling=null,histList=[];

function setSt(cls,html){st.className='show '+cls;st.innerHTML='<span class="idot"></span>'+html}

function render(d){
  const r=d.result||{};
  const ok=d.injected||(r&&r.trial_granted);
  $('hero').className='verdict '+(ok?'':'fail');
  $('verdict').textContent=ok?'SUCCESS':'FAILED';
  $('herolabel').textContent=ok?'trial injected':'not injected';
  const rp=$('respill');rp.classList.toggle('bad',!ok);
  $('rdot').style.background=ok?'var(--ok)':'var(--bad)';
  $('rtext').textContent=ok?'SUCCESS':'FAILED';
  $('durms').textContent=d.duration_ms!=null?d.duration_ms+' ms':'-';
  const stats=[
    ['Name',val(r.name)],['Email',val(r.email)],['Plan',val(r.plan)],
    ['Trial granted',r.trial_granted?'yes':'no'],
    ['Credits',(r.credits_remaining||0)+' / '+(r.credits_total||0)],
  ];
  $('result-stats').innerHTML=stats.map(([k,v])=>'<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>').join('');
  out.classList.remove('hidden');out.classList.add('show');
}

async function loadHistory(){
  try{
    const r=await fetch('/api/public/stats');const d=await r.json();
    histList=d.history||[];
    $('injected-total').textContent=(d.injected_total||0)+' injected';
    const ul=$('hist');
    if(!histList.length){ul.innerHTML='<li class="histempty">No attempts yet.</li>';return}
    ul.innerHTML=histList.slice(0,10).map(h=>{
      const c=h.ok?'var(--ok)':'var(--bad)';const lbl=h.ok?'SUCCESS':'FAILED';const cls=h.ok?'ok':'fail';
      return '<li><span class="dot2" style="background:'+c+'"></span><span class="hp">'+esc(String(h.pat||'').slice(0,19))+'</span><span class="htime">'+relTime(h.ts)+'</span><span class="hist-label '+cls+'">'+lbl+'</span></li>';
    }).join('');
  }catch(_){}
}
const relTime=ts=>{if(!ts)return'';let t=Number(ts);if(t<1e12)t*=1000;const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return Math.floor(s)+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';return Math.floor(s/3600)+'h ago'};

function startLogPolling(jobId){
  logBox.classList.add('show');logContent.innerHTML='';let last=0;
  logPolling=setInterval(async()=>{
    try{
      const r=await fetch('/api/inject/logs?id='+jobId);const d=await r.json();
      if(d.logs.length>last){
        for(let i=last;i<d.logs.length;i++){
          const line=document.createElement('div');line.className='log-line';const t=d.logs[i];
          if(t.includes('SUCCESS')||t.includes('OK'))line.classList.add('success');
          else if(t.includes('FAILED')||t.includes('ERROR'))line.classList.add('error');
          else if(t.includes('[INJECT]')||t.includes('['))line.classList.add('inject');
          line.textContent=t;logContent.appendChild(line);
        }
        last=d.logs.length;logBox.scrollTop=logBox.scrollHeight;
      }
    }catch(_){}
  },1000);
}
function stopLogPolling(){if(logPolling){clearInterval(logPolling);logPolling=null}}

f.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const pat=patIn.value.trim();
  if(!pat||!pat.startsWith('pt-')){err.textContent='PAT must start with pt-';err.classList.remove('hidden');return}
  btn.disabled=true;btn.classList.add('loading');btn.querySelector('.txt').textContent='Injecting...';
  err.classList.add('hidden');out.classList.remove('show');logContent.innerHTML='';
  setSt('st-processing','🟡 Starting injection...');
  try{
    const r=await fetch('/api/inject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pat})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||('HTTP '+r.status))}
    const d=await r.json();if(!d.job_id)throw new Error('No job ID');
    startLogPolling(d.job_id);
    setSt('st-processing','🟡 Processing... please wait');
    let attempts=0;
    polling=setInterval(async()=>{
      attempts++;
      if(attempts>=180){clearInterval(polling);stopLogPolling();setSt('st-fail','⏱️ Timeout');btn.disabled=false;btn.classList.remove('loading');btn.querySelector('.txt').textContent='Inject trial';loadHistory();return}
      try{
        const sr=await fetch('/api/inject/status?id='+d.job_id);const sd=await sr.json();
        if(sd.done){
          clearInterval(polling);stopLogPolling();render(sd);
          if(sd.injected)setSt('st-success','✅ SUCCESS — Trial injected!');
          else setSt('st-fail','❌ FAILED — Trial not granted');
          btn.disabled=false;btn.classList.remove('loading');btn.querySelector('.txt').textContent='Inject trial';loadHistory();
        }else{setSt('st-processing','🟡 Processing'+'.\u200b'.repeat((attempts%3)+1)+' ('+(attempts*2)+'s)')}
      }catch(_){}
    },2000);
  }catch(ex){
    err.textContent=ex.message||'Injection failed';err.classList.remove('hidden');
    setSt('st-fail','❌ Error: '+esc(ex.message||''));
    btn.disabled=false;btn.classList.remove('loading');btn.querySelector('.txt').textContent='Inject trial';
  }
});
loadHistory();setInterval(loadHistory,5000);
</script></body></html>
