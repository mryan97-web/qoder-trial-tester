<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qoder IDE Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;padding:20px;max-width:700px;margin:0 auto}
h1{font-size:1.5em;margin-bottom:10px;color:#58a6ff}
.info{background:#161b22;padding:12px;border-radius:8px;margin-bottom:15px;border:1px solid #30363d;font-size:0.85em;color:#8b949e}
.btn-row{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
button{background:#238636;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:0.95em;cursor:pointer}
button:disabled{background:#21262d;color:#6e7681;cursor:wait}
button.test-btn{background:#1f6feb}
input{width:100%;padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:0.9em;margin-bottom:10px}
.step-log{background:#161b22;padding:8px 12px;border-radius:4px;margin-top:8px;font-family:monospace;font-size:0.8em;max-height:500px;overflow-y:auto;border:1px solid #30363d}
.step-ok{color:#3fb950}.step-fail{color:#f85149}.step-skip{color:#d29922}.step-info{color:#58a6ff}
.status-box{padding:15px;border-radius:8px;margin-bottom:10px;display:none}
.status-loading{background:#1c2128;border:1px solid #30363d;color:#8b949e}
.status-ok{background:#0d2818;border:1px solid #238636;color:#3fb950}
.status-fail{background:#2d0d0d;border:1px solid #f85149;color:#f85149}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:sp 1s linear infinite;margin-right:5px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
#main-card{background:#161b22;border-radius:8px;padding:0;margin-top:10px}
.result-ok{border:2px solid #238636}.result-fail{border:2px solid #f85149}
table{width:100%;border-collapse:collapse}
td{padding:6px 10px;border-bottom:1px solid #30363d;font-size:0.85em}
td:first-child{color:#8b949e;width:35%}
#raw-out{display:none;margin-top:10px;padding:10px;background:#0d1117;border-radius:4px;font-family:monospace;font-size:0.75em;white-space:pre-wrap;word-break:break-all;color:#8b949e;max-height:300px;overflow-y:auto}
.hidden{display:none!important}
.session-list{margin-top:10px;padding:10px;background:#161b22;border-radius:6px;border:1px solid #30363d}
.session-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #21262d;font-size:0.8em}
.session-item:last-child{border-bottom:none}
.heartbeat-dot{width:8px;height:8px;border-radius:50%;background:#3fb950;display:inline-block;margin-right:5px}
.heartbeat-dot.dead{background:#f85149}
</style>
</head>
<body>
<h1>🔥 Qoder IDE Simulator</h1>
<div class="info">Paste PAT → WASM-signed request → center.qoder.sh → Trial activated<br>Keep-alive: all sessions stay alive via background heartbeat</div>

<div class="btn-row">
<button class="test-btn" id="test-btn" onclick="runSelfTest()">🧪 Test WASM (no account)</button>
</div>

<div id="step1">
<input id="pat-input" type="text" placeholder="Paste Personal Access Token (from qoder.com → Account → Developer)" style="margin-bottom:10px">
<button id="start-btn" onclick="startInject()">Inject Trial</button>
</div>

<div id="step3" class="hidden">
<div id="status-box" class="status-box"></div>
<div class="step-log" id="step-log"></div>
</div>

<div id="main-card"></div>
<div id="raw-out"></div>

<div class="session-list hidden" id="session-list-box">
<strong style="color:#58a6ff;font-size:0.85em">Active Sessions (keep-alive)</strong>
<div id="session-list"></div>
</div>

<script>
// ===== Config =====
const OPENAPI='https://openapi.qoder.sh';
const CENTER='https://center.qoder.sh';
const VERSION='0.2.11';
const CLIENT_TYPE='6';
const MACHINE_OS='arm64_darwin';
const HEARTBEAT_MS=300000;

// ===== Session management =====
let sessions={};
let heartbeatTimer=null;
function loadSessions(){try{sessions=JSON.parse(localStorage.getItem('qoder_sessions')||'{}');}catch{sessions={};}}
function saveSessions(){localStorage.setItem('qoder_sessions',JSON.stringify(sessions));}
function addSession(k,d){sessions[k]=d;saveSessions();renderSessions();startHeartbeat();}
function removeSession(k){delete sessions[k];saveSessions();renderSessions();}
function renderSessions(){
const box=document.getElementById('session-list-box');
const list=document.getElementById('session-list');
const keys=Object.keys(sessions);
if(keys.length===0){box.classList.add('hidden');return;}
box.classList.remove('hidden');
list.innerHTML='';
for(const k of keys){const s=sessions[k];
const dot=s.alive?'<span class="heartbeat-dot"></span>':'<span class="heartbeat-dot dead"></span>';
const ago=s.lastHeartbeat?Math.round((Date.now()-s.lastHeartbeat)/1000)+'s ago':'never';
list.innerHTML+='<div class="session-item"><span>'+dot+(s.name||k)+' — '+s.status+' — '+ago+'</span><button style="background:#da3633;padding:2px 8px;font-size:0.8em" onclick="removeSession(\''+k+'\')">✕</button></div>';
}}
function startHeartbeat(){
if(heartbeatTimer)clearInterval(heartbeatTimer);
heartbeatTimer=setInterval(async()=>{
for(const k of Object.keys(sessions)){const s=sessions[k];if(!s.alive)continue;
try{const h={'Accept':'application/json','Authorization':'Bearer '+s.token,'Cosy-Version':VERSION,'Cosy-ClientType':CLIENT_TYPE,'Cosy-MachineOS':MACHINE_OS,'Cosy-MachineId':s.machineId,'Cosy-MachineToken':s.machineToken,'Cosy-MachineType':s.machineType};
const d=await proxy(`${OPENAPI}/api/v3/user/status`,'GET',h);
sessions[k].lastHeartbeat=Date.now();sessions[k].alive=d.status===200;saveSessions();
}catch{sessions[k].alive=false;saveSessions();}}
renderSessions();
},HEARTBEAT_MS);
}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showStatus(m,c){const b=document.getElementById('status-box');b.className='status-box '+c;b.style.display='block';b.innerHTML=m;}
function log(t,c){document.getElementById('step-log').innerHTML+='<div class="'+(c||'')+'">'+t+'</div>';}
function clearLog(){document.getElementById('step-log').innerHTML='';}

// Fake machineToken (88-char base64url = 66 bytes, same format as UMID)
function genMachineToken(){const b=new Uint8Array(66);crypto.getRandomValues(b);let s='';for(let i=0;i<66;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function genMachineType(){return Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,'0')).join('');}

async function proxy(url,method,headers,body){
const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({url,method,headers,body:body||null})});
return r.json();
}

// ===== WASM =====
let wExp=null,wMem=null;
const objs=[null];let nextSlot=1;
function pushObj(v){if(v===undefined)return 0;const s=nextSlot;objs[s]=v;nextSlot++;return s;}
function getObj(s){return objs[s];}
function dropObj(s){objs[s]=null;}
const enc=new TextEncoder();
const dec=new TextDecoder('utf-8',{ignoreBOM:true,fatal:true});
function dStr(p,l){return dec.decode(new Uint8Array(wMem.buffer,p>>>0,l>>>0));}

const wImports={
'./qoder_auth_wasm_bg.js':{
__wbg_Error_2e59b1b37a9a34c3:(p,l)=>pushObj(Error(dStr(p,l))),
__wbg___wbindgen_is_function_49868bde5eb1e745:s=>typeof getObj(s)==='function'?1:0,
__wbg___wbindgen_is_object_40c5a80572e8f9d3:s=>{const v=getObj(s);return typeof v==='object'&&v!==null?1:0;},
__wbg___wbindgen_is_string_b29b5c5a8065ba1a:s=>typeof getObj(s)==='string'?1:0,
__wbg___wbindgen_is_undefined_c0cca72b82b86f4d:s=>getObj(s)===undefined?1:0,
__wbg___wbindgen_throw_81fc77679af83bc6:(p,l)=>{throw new Error(dStr(p,l));},
__wbg_call_d578befcc3145dee:(a,b,c)=>{try{return pushObj(getObj(a).call(getObj(b),getObj(c)));}catch(e){return pushObj(e);}},
__wbg_crypto_38df2bab126b63dc:s=>pushObj(getObj(s).crypto),
__wbg_getRandomValues_c44a50d8cfdaebeb:(a,b)=>{try{getObj(a).getRandomValues(getObj(b));}catch(e){return pushObj(e);}},
__wbg_getRandomValues_d49329ff89a07af1:(p,l)=>{try{crypto.getRandomValues(new Uint8Array(wMem.buffer,p>>>0,l>>>0));}catch(e){return pushObj(e);}},
__wbg_length_0c32cb8543c8e4c8:s=>getObj(s).length,
__wbg_msCrypto_bd5a034af96bcba6:s=>0,
__wbg_new_99cabae501c0a8a0:()=>pushObj(new Map()),
__wbg_new_with_length_9cedd08484b73942:l=>pushObj(new Uint8Array(l>>>0)),
__wbg_node_84ea875411254db1:s=>0,
__wbg_now_88621c9c9a4f3ffc:()=>Date.now(),
__wbg_process_44c7a14e11e9f69e:s=>0,
__wbg_prototypesetcall_3e05eb9545565046:(p,l,v)=>Uint8Array.prototype.set.call(new Uint8Array(wMem.buffer,p>>>0,l>>>0),getObj(v)),
__wbg_randomFillSync_6c25eac9869eb53c:(a,b)=>0,
__wbg_require_b4edbdcf3e2a1ef0:()=>0,
__wbg_set_08463b1df38a7e29:(m,k,v)=>pushObj(getObj(m).set(getObj(k),getObj(v))),
__wbg_static_accessor_GLOBAL_THIS_a1248013d790bf5f:()=>pushObj(globalThis),
__wbg_static_accessor_GLOBAL_f2e0f995a21329ff:()=>0,
__wbg_static_accessor_SELF_24f78b6d23f286ea:()=>0,
__wbg_static_accessor_WINDOW_59fd959c540fe405:()=>pushObj(window),
__wbg_subarray_0f98d3fb634508ad:(s,a,b)=>pushObj(getObj(s).subarray(a>>>0,b>>>0)),
__wbg_versions_276b2795b1c6a219:s=>0,
__wbindgen_cast_0000000000000001:(p,l)=>pushObj(new Uint8Array(wMem.buffer,p>>>0,l>>>0)),
__wbindgen_cast_0000000000000002:(p,l)=>pushObj(dStr(p,l)),
__wbindgen_object_clone_ref:s=>pushObj(getObj(s)),
__wbindgen_object_drop_ref:s=>dropObj(s),
}
};

async function loadWasm(){
if(wExp)return true;
showStatus('<span class="spinner"></span>Loading WASM...','status-loading');
log('Fetching /qoder_auth.wasm...','');
const r=await fetch('/qoder_auth.wasm');
const buf=await r.arrayBuffer();
log('WASM file: '+buf.byteLength+' bytes','step-ok');
log('Instantiating WASM...','');
const{instance}=await WebAssembly.instantiate(buf,wImports);
wExp=instance.exports;
wMem=wExp.memory;
log('WASM loaded!','step-ok');
const fns=Object.keys(wExp).filter(k=>typeof wExp[k]==='function');
log('Exports ('+fns.length+'): '+fns.join(', '),'step-info');
return true;
}

function passStr(s){const buf=enc.encode(s);const ptr=wExp.__wbindgen_export2(buf.length,1)>>>0;new Uint8Array(wMem.buffer).set(buf,ptr);return[ptr,buf.length];}
function createWasmCtx(mi,cv,ui,cm){
const[a,b]=passStr(mi),[c,d]=passStr(cv),[e,f]=passStr(ui),[g,h]=passStr(cm);
return wExp.qodercontext_new(a,b,c,d,e,f,g,h)>>>0;
}
function genAuthFields(uij){
const[p,l]=passStr(uij);
const sp=wExp.__wbindgen_add_to_stack_pointer(-16);
try{wExp.generate_runtime_auth_fields(p,l);
const dv=new DataView(wMem.buffer);const rP=dv.getInt32(sp,true),rL=dv.getInt32(sp+4,true);
if(dv.getInt32(sp+8,true))throw new Error('genAuthFields error');
const json=dStr(rP,rL);wExp.__wbindgen_export4(rP,rL,1);return JSON.parse(json);
}finally{wExp.__wbindgen_add_to_stack_pointer(16);}
}
function wasmPrepareRequest(ctx,ep,path,method,authMode,body){
const[a,b]=passStr(ep),[c,d]=passStr(path),[e,f]=passStr(method),[g,h]=passStr(authMode);
let bP=0,bL=0;if(body){const[x,y]=passStr(body);bP=x;bL=y;}
const sp=wExp.__wbindgen_add_to_stack_pointer(-16);
try{wExp.qodercontext_prepareRequest(sp,ctx,a,b,c,d,e,f,g,h,bP,bL,0,0);
const dv=new DataView(wMem.buffer);const rP=dv.getInt32(sp,true);
if(dv.getInt32(sp+8,true))throw new Error('prepareRequest error');return rP>>>0;
}finally{wExp.__wbindgen_add_to_stack_pointer(16);}
}
function readResult(rPtr){
let url='',body='';
let sp=wExp.__wbindgen_add_to_stack_pointer(-16);
try{wExp.requestresult_url(sp,rPtr);const dv=new DataView(wMem.buffer);
const p=dv.getInt32(sp,true),l=dv.getInt32(sp+4,true);url=dStr(p,l);wExp.__wbindgen_export4(p,l,1);
}finally{wExp.__wbindgen_add_to_stack_pointer(16);}
const hIdx=wExp.requestresult_headers(rPtr);const hm=getObj(hIdx);dropObj(hIdx);
const headers={};if(hm&&hm.forEach)hm.forEach((v,k)=>headers[k]=v);
sp=wExp.__wbindgen_add_to_stack_pointer(-16);
try{wExp.requestresult_body(sp,rPtr);const dv=new DataView(wMem.buffer);
const p=dv.getInt32(sp,true),l=dv.getInt32(sp+4,true);
if(p!==0){body=dStr(p,l);wExp.__wbindgen_export4(p,l,1);}
}finally{wExp.__wbindgen_add_to_stack_pointer(16);}
return{url,headers,body};
}

// ===== SELF TEST =====
async function runSelfTest(){
const btn=document.getElementById('test-btn');
btn.disabled=true;btn.textContent='Testing...';
show('step3');clearLog();
let allOk=true;

log('===== TEST 1: WASM Load =====','step-info');
try{await loadWasm();log('WASM loaded','step-ok');}
catch(e){log('WASM FAILED: '+e.message,'step-fail');btn.disabled=false;btn.textContent='🧪 Test WASM (no account)';showStatus('WASM test failed','status-fail');return;}

log('===== TEST 2: QoderContext =====','step-info');
let ctx=0;
try{const mi=crypto.randomUUID();
ctx=createWasmCtx(mi,VERSION,JSON.stringify({uid:'test',encrypt_user_info:'',key:''}),JSON.stringify({client_type:'6',business_product:'qoder_work',business_type:'agent',scene:'assistant'}));
log('QoderContext created (ptr='+ctx+')','step-ok');
}catch(e){log('Context FAILED: '+e.message,'step-fail');allOk=false;}

log('===== TEST 3: generate_runtime_auth_fields =====','step-info');
try{const f=genAuthFields(JSON.stringify({uid:'test',organization_id:'',organization_tags:[],data_policy_agreed:true}));
log('encrypt_user_info: '+(f.encrypt_user_info||'empty').substring(0,40),'step-ok');
log('key: '+(f.key||'empty').substring(0,40),'step-ok');
}catch(e){log('genAuthFields FAILED: '+e.message,'step-fail');allOk=false;}

log('===== TEST 4: prepareRequest =====','step-info');
try{if(ctx>0){
const rPtr=wasmPrepareRequest(ctx,CENTER,'/api/v2/config/updateDataPolicy?requestId=test&version=2','POST','auth','{}');
const s=readResult(rPtr);
log('Signed URL: '+s.url.substring(0,100),'step-ok');
log('Signed headers: '+JSON.stringify(s.headers).substring(0,120),'step-ok');
log('Signed body: '+(s.body||'').substring(0,60),'step-ok');
if(wExp.__wbg_requestresult_free)wExp.__wbg_requestresult_free(rPtr,0);
}}catch(e){log('prepareRequest FAILED: '+e.message,'step-fail');allOk=false;}

log('===== TEST 5: Proxy reachability =====','step-info');
try{const d=await proxy(`${CENTER}/api/v2/config/updateDataPolicy?requestId=ping&version=2`,'POST',{'Accept':'application/json','Content-Type':'application/json','Authorization':'Bearer test'},'{}');
log('center.qoder.sh → '+d.status+': '+d.body.substring(0,60),d.status!==0?'step-ok':'step-fail');
}catch(e){log('Proxy FAILED: '+e.message,'step-fail');allOk=false;}

log('===== SUMMARY =====','step-info');
if(allOk){log('ALL TESTS PASSED — ready to inject','step-ok');
showStatus('✅ Self-test PASSED! Paste PAT and click Inject Trial.','status-ok');
}else{log('Some tests failed','step-fail');showStatus('⚠️ Some tests failed. Check logs.','status-fail');}
btn.disabled=false;btn.textContent='🧪 Test WASM (no account)';
}

// ===== INJECT (PAT flow, not device polling) =====
async function startInject(){
const pat=document.getElementById('pat-input').value.trim();
if(!pat){alert('Paste PAT first (from qoder.com → Account → Developer)');return;}
const btn=document.getElementById('start-btn');
btn.disabled=true;btn.textContent='Injecting...';
show('step3');clearLog();
const mId=crypto.randomUUID();
const mTok=genMachineToken();
const mType=genMachineType();

// Step 1: Load WASM
log('===== STEP 1: Load WASM =====','step-info');
try{await loadWasm();log('WASM ready','step-ok');}
catch(e){log('WASM FAILED: '+e.message,'step-fail');btn.disabled=false;btn.textContent='Inject Trial';return;}

// Step 2: Exchange PAT → token
log('===== STEP 2: Exchange PAT =====','step-info');
showStatus('<span class="spinner"></span>Exchanging PAT...','status-loading');
const exD=await proxy(`${OPENAPI}/api/v1/jobToken/exchange`,'POST',
{'Accept':'application/json','Content-Type':'application/json','Cosy-Version':VERSION,'Cosy-ClientType':CLIENT_TYPE,'Cosy-MachineOS':MACHINE_OS},
JSON.stringify({personal_token:pat}));
if(exD.status!==200){log('Exchange FAILED: '+exD.status+' '+exD.body,'step-fail');
showStatus('❌ PAT exchange failed: '+exD.body,'status-fail');btn.disabled=false;btn.textContent='Inject Trial';return;}
const exBody=JSON.parse(exD.body);
const token=exBody.token||exBody.device_token||exBody.access_token;
if(!token){log('No token in response','step-fail');showStatus('❌ No token in response','status-fail');btn.disabled=false;btn.textContent='Inject Trial';return;}
log('Token received','step-ok');

// Step 3: Get userinfo
log('===== STEP 3: Get userinfo =====','step-info');
showStatus('<span class="spinner"></span>Reading user info...','status-loading');
const aH={'Accept':'application/json','User-Agent':'qoder/'+VERSION,'Authorization':'Bearer '+token,
'Cosy-Version':VERSION,'Cosy-ClientType':CLIENT_TYPE,'Cosy-MachineOS':MACHINE_OS,
'Cosy-MachineId':mId,'Cosy-MachineToken':mTok,'Cosy-MachineType':mType};
const uiD=await proxy(`${OPENAPI}/api/v1/userinfo`,'GET',aH);
const ui=uiD.status===200?JSON.parse(uiD.body):{};
log('GET /api/v1/userinfo → '+uiD.status+': '+(ui.name||ui.email||'?'),'step-ok');

// Step 4: WASM context + auth fields
log('===== STEP 4: WASM auth fields =====','step-info');
let encryptInfo='',key='',wasmCtx=0;
if(wExp){
try{
wasmCtx=createWasmCtx(mId,VERSION,JSON.stringify({uid:ui.uid||ui.id||'',encrypt_user_info:'',key:''}),
JSON.stringify({client_type:'6',business_product:'qoder_work',business_type:'agent',scene:'assistant'}));
log('QoderContext created','step-ok');
const f=genAuthFields(JSON.stringify({uid:ui.uid||ui.id||'',organization_id:ui.organization_id||'',organization_tags:ui.organization_tags||[],data_policy_agreed:true}));
encryptInfo=f.encrypt_user_info||'';key=f.key||'';
log('encrypt_user_info: '+(encryptInfo.substring(0,30)||'empty'),'step-ok');
log('key: '+(key.substring(0,30)||'empty'),'step-ok');
if(wExp.qodercontext_refreshAuthFields&&encryptInfo){
const[nP,nL]=passStr(JSON.stringify({uid:ui.uid||ui.id||'',encrypt_user_info:encryptInfo,key:key}));
wExp.qodercontext_refreshAuthFields(wasmCtx,nP,nL);log('Context refreshed','step-ok');
}
}catch(e){log('WASM auth FAILED: '+e.message,'step-fail');}
}

// Step 5: WASM-signed POST to center.qoder.sh
log('===== STEP 5: WASM-signed updateDataPolicy =====','step-info');
showStatus('<span class="spinner"></span>Signing + sending to center.qoder.sh...','status-loading');
const reqId=crypto.randomUUID();
const policyBody=JSON.stringify({payload:JSON.stringify({uid:ui.uid||ui.id||'',aid:'',status:'AGREE',UpdateTimestamp:Date.now(),LingmaVersion:VERSION,requestId:reqId}),encodeVersion:'1'});
const policyPath='/api/v2/config/updateDataPolicy?requestId='+reqId+'&version=2';
let policyD;
if(wExp&&wasmCtx>0){
try{
const rPtr=wasmPrepareRequest(wasmCtx,CENTER,policyPath,'POST','auth',policyBody);
const signed=readResult(rPtr);
log('Signed URL: '+signed.url.substring(0,100),'step-ok');
log('Signed headers: '+JSON.stringify(signed.headers).substring(0,120),'step-ok');
policyD=await proxy(signed.url,'POST',signed.headers,signed.body||policyBody);
log('POST center → '+policyD.status+': '+policyD.body.substring(0,100),policyD.status===200?'step-ok':'step-fail');
if(wExp.__wbg_requestresult_free)wExp.__wbg_requestresult_free(rPtr,0);
}catch(e){log('WASM prepareRequest FAILED: '+e.message,'step-fail');policyD={status:0,body:e.message};}
}else{
policyD=await proxy(CENTER+policyPath,'POST',aH,policyBody);
log('POST center (unsigned) → '+policyD.status+': '+policyD.body.substring(0,100),'step-skip');
}

// Step 6: GET /api/v3/user/status
log('===== STEP 6: user/status =====','step-info');
const stD=await proxy(OPENAPI+'/api/v3/user/status','GET',aH);
log('GET /api/v3/user/status → '+stD.status+': '+stD.body.substring(0,100),stD.status===200?'step-ok':'step-skip');

// Step 7: Verify
log('===== STEP 7: Verify =====','step-info');
showStatus('<span class="spinner"></span>Verifying trial...','status-loading');
const plD=await proxy(OPENAPI+'/api/v2/user/plan','GET',aH);
const pl=plD.status===200?JSON.parse(plD.body):{};
log('GET /api/v2/user/plan → '+plD.status+': '+JSON.stringify(pl).substring(0,80),plD.status===200?'step-ok':'step-skip');
const qD=await proxy(OPENAPI+'/api/v2/quota/usage','GET',aH);
const q=qD.status===200?JSON.parse(qD.body):{};
log('GET /api/v2/quota/usage → '+qD.status+': '+JSON.stringify(q).substring(0,80),qD.status===200?'step-ok':'step-skip');

// Raw
const raw=document.getElementById('raw-out');
raw.style.display='block';
raw.textContent='userinfo: '+JSON.stringify(ui,null,2).substring(0,300)+
'\n\npolicy: '+policyD.body.substring(0,300)+
'\n\nplan: '+JSON.stringify(pl,null,2).substring(0,300)+
'\n\nquota: '+JSON.stringify(q,null,2).substring(0,300);

// Result
const card=document.getElementById('main-card');
const hasCredits=q.userQuota?.total>0||q.total>0;
const isPro=pl.plan==='pro'||pl.plan_type==='trial'||pl.user_type==='trial'||pl.user_type==='pro';
if(isPro||hasCredits){
card.className='result-ok';
let h='<table>';
h+='<tr><td>User</td><td>'+(ui.name||'?')+'</td></tr>';
h+='<tr><td>Plan</td><td><strong>'+(pl.plan||pl.plan_type||'?')+'</strong></td></tr>';
h+='<tr><td>Credits</td><td>'+(q.userQuota?.total||q.total||0)+'</td></tr>';
h+='</table>';
showStatus('✅ Inject SUCCESS — Trial Activated!'+h,'status-ok');
addSession(ui.uid||ui.id||Date.now().toString(),{token,machineId:mId,machineToken:mTok,machineType:mType,name:ui.name||ui.email||sessionKey,status:'trial',lastHeartbeat:Date.now(),alive:true});
}else{
card.className='result-fail';
let h='<table>';
h+='<tr><td>User</td><td>'+(ui.name||'?')+'</td></tr>';
h+='<tr><td>Plan</td><td>'+(pl.plan||pl.plan_type||'?')+'</td></tr>';
h+='<tr><td>Type</td><td>'+(pl.user_type||pl.userType||'?')+'</td></tr>';
h+='<tr><td>Credits</td><td>'+JSON.stringify(q).substring(0,100)+'</td></tr>';
h+='<tr><td>Policy</td><td>'+policyD.status+': '+policyD.body.substring(0,80)+'</td></tr>';
h+='</table>';
showStatus('❌ Inject FAILED'+h,'status-fail');
}
btn.disabled=false;btn.textContent='Inject Trial';
}

// Init
loadSessions();renderSessions();
if(Object.keys(sessions).length>0)startHeartbeat();
</script>
</body>
</html>
